{% extends "base.html" %}

{% block title %}{{ titulo }} - Hotel Paradise{% endblock %}

{% block content %}
<h2>{{ titulo }}</h2>
<form method="POST" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Guardar</button>
</form>
<a href="{% url 'lista_habitaciones' %}">Volver a la lista</a>
{% endblock %}
